name: CO-ATTAIN PRO AI — CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend — Pytest (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Alembic migrations
        run: |
          cd backend
          alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./co_attain_test.db
          SECRET_KEY: ci-test-secret-key-minimum-32-bytes-long

      - name: Run pytest test suite
        run: python -m pytest -v --tb=short
        env:
          DATABASE_URL: sqlite:///./co_attain_test.db
          SECRET_KEY: ci-test-secret-key-minimum-32-bytes-long

  frontend-build:
    name: Frontend — TypeScript + Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Run oxlint (lint check)
        run: npm run lint
        working-directory: frontend

      - name: TypeScript type check + production build
        run: npm run build
        working-directory: frontend

  security-audit:
    name: Security — npm audit
    runs-on: ubuntu-latest
    needs: frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        working-directory: frontend

      - name: Audit for high/critical vulnerabilities
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true
